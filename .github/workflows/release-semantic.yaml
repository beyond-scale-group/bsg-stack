name: Semantic Release

on:
  workflow_call:
    inputs:
      semantic_version:
        description: "semantic-release version"
        required: false
        type: string
        default: "24.1.2"
      extra_plugins:
        description: "Extra plugins (space-separated)"
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      working_directory:
        description: "Working directory"
        required: false
        type: string
        default: "."
    secrets:
      token:
        description: "GitHub token with push and release permissions"
        required: true

jobs:
  release:
    name: Semantic Release
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.token }}

      - name: Configure git credentials
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${{ secrets.token }}@github.com/${{ github.repository }}.git"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: ${{ inputs.semantic_version }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-writer@8
            ${{ inputs.extra_plugins }}
          working_directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      # Keep a moving major-version tag (e.g. `v2`) pointing at the
      # latest release of that major. Callers pin to `@v2` to follow
      # the major without manual bumps; older majors stay frozen.
      - name: Update major-version moving tag
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          MAJOR: v${{ steps.semantic.outputs.new_release_major_version }}
        run: |
          set -euo pipefail
          echo "Moving tag $MAJOR → $NEW_TAG"
          git tag -f "$MAJOR" "$NEW_TAG"
          git push origin "$MAJOR" --force
