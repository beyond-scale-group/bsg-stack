name: Sync Branches

on:
  workflow_call:
    inputs:
      from:
        description: "Source branch"
        required: false
        type: string
        default: "main"
      to:
        description: "Target branch"
        required: false
        type: string
        default: "staging"
      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  sync:
    name: Sync ${{ inputs.from }} → ${{ inputs.to }}
    runs-on: ${{ inputs.runs_on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.to }}

      - name: Merge source into target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/${{ inputs.from }} --no-edit

      - name: Push
        run: git push origin ${{ inputs.to }}
