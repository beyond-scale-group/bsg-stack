name: Sync Branches (AI-enhanced)

on:
  workflow_call:
    inputs:
      from:
        description: "Source branch"
        required: false
        type: string
        default: "main"
      to:
        description: "Target branch"
        required: false
        type: string
        default: "staging"
      ai_resolve:
        description: "Use AI to resolve merge conflicts"
        required: false
        type: boolean
        default: false
      ai_resolve_script:
        description: "Path to AI conflict resolution script (relative to repo root)"
        required: false
        type: string
        default: ".github/scripts/resolve-conflicts-with-claude.sh"
      create_pr:
        description: "Create a PR instead of direct push"
        required: false
        type: boolean
        default: true
      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      token:
        description: "GitHub token with push and PR permissions"
        required: true
      anthropic_api_key:
        description: "Anthropic API key for AI conflict resolution"
        required: false

jobs:
  sync:
    name: Sync ${{ inputs.from }} → ${{ inputs.to }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.to }}
          fetch-depth: 0
          token: ${{ secrets.token }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check sync status
        id: check
        run: |
          git fetch origin ${{ inputs.from }}
          BEHIND_COUNT=$(git rev-list --count ${{ inputs.to }}..origin/${{ inputs.from }})
          echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "status=up_to_date" >> $GITHUB_OUTPUT
          else
            echo "status=behind" >> $GITHUB_OUTPUT
            echo "${{ inputs.to }} is $BEHIND_COUNT commits behind ${{ inputs.from }}"
          fi

      - name: Backup AI resolution script
        if: steps.check.outputs.status == 'behind' && inputs.ai_resolve
        run: |
          SCRIPT="${{ inputs.ai_resolve_script }}"
          if git show origin/${{ inputs.from }}:${SCRIPT} > /tmp/resolve-conflicts.sh 2>/dev/null; then
            chmod +x /tmp/resolve-conflicts.sh
            echo "Backed up AI resolution script from origin/${{ inputs.from }}"
          else
            echo "No AI resolution script found at ${SCRIPT}"
          fi

      - name: Try merge
        id: merge
        if: steps.check.outputs.status == 'behind'
        run: |
          if git merge origin/${{ inputs.from }} --no-edit -m "chore: auto-sync ${{ inputs.from }} into ${{ inputs.to }}"; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=conflict" >> $GITHUB_OUTPUT
            git diff --name-only --diff-filter=U > /tmp/unmerged_files.txt
            echo "Conflicted files:"
            cat /tmp/unmerged_files.txt
          fi

      - name: Resolve conflicts with AI
        id: resolve
        if: steps.merge.outputs.status == 'conflict' && inputs.ai_resolve
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
        run: |
          if [ -f /tmp/resolve-conflicts.sh ]; then
            /tmp/resolve-conflicts.sh
          else
            echo "resolved=false" >> $GITHUB_OUTPUT
            echo "No AI resolution script available"
          fi

      - name: Direct push (no PR)
        if: "!inputs.create_pr && steps.merge.outputs.status == 'success'"
        run: git push origin ${{ inputs.to }}

      - name: Create PR for clean merge
        id: pr_clean
        if: inputs.create_pr && steps.merge.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="sync/${{ inputs.from }}-to-${{ inputs.to }}-$TIMESTAMP"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base ${{ inputs.to }} \
            --head "$BRANCH" \
            --title "Sync ${{ inputs.from }} to ${{ inputs.to }}" \
            --body "Auto-sync: ${{ steps.check.outputs.behind_count }} commits from \`${{ inputs.from }}\` to \`${{ inputs.to }}\`. Clean merge, no conflicts." \
            --label "sync")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Create PR for AI-resolved merge
        id: pr_resolved
        if: inputs.create_pr && steps.resolve.outputs.resolved == 'true'
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="sync/${{ inputs.from }}-to-${{ inputs.to }}-$TIMESTAMP"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          BODY_FILE="/tmp/resolution-report.md"
          if [ ! -f "$BODY_FILE" ]; then
            echo "AI-resolved conflicts for sync of \`${{ inputs.from }}\` into \`${{ inputs.to }}\`." > "$BODY_FILE"
          fi

          PR_URL=$(gh pr create \
            --base ${{ inputs.to }} \
            --head "$BRANCH" \
            --title "Sync ${{ inputs.from }} to ${{ inputs.to }} (AI-resolved)" \
            --body-file "$BODY_FILE" \
            --label "sync")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Create PR for manual review
        id: pr_manual
        if: inputs.create_pr && steps.merge.outputs.status == 'conflict' && steps.resolve.outputs.resolved != 'true'
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="sync/${{ inputs.from }}-to-${{ inputs.to }}-$TIMESTAMP"
          git merge --abort 2>/dev/null || true
          git checkout origin/${{ inputs.from }}
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          BODY_FILE="/tmp/resolution-report.md"
          if [ ! -f "$BODY_FILE" ]; then
            echo "Manual conflict resolution needed for sync of \`${{ inputs.from }}\` into \`${{ inputs.to }}\`." > "$BODY_FILE"
          fi

          PR_URL=$(gh pr create \
            --base ${{ inputs.to }} \
            --head "$BRANCH" \
            --title "Sync ${{ inputs.from }} to ${{ inputs.to }} (manual resolution needed)" \
            --body-file "$BODY_FILE" \
            --label "sync")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
