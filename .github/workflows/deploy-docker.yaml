name: Docker Build and Push

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      working_directory:
        description: "Working directory"
        required: false
        type: string
        default: "."
      registry:
        description: "Container registry (e.g. ghcr.io)"
        required: false
        type: string
        default: "ghcr.io"
      image_name:
        description: "Docker image name (e.g. my-app). Defaults to repository name."
        required: false
        type: string
        default: ""
      image_tag:
        description: "Docker image tag (defaults to git ref name)"
        required: false
        type: string
        default: ""
      platforms:
        description: "Docker build platforms"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      build_args:
        description: "Docker build arguments (newline-separated KEY=VALUE)"
        required: false
        type: string
        default: ""
    secrets:
      registry_username:
        description: "Registry username (defaults to github.actor for GHCR)"
        required: false
      registry_password:
        description: "Registry password / token (defaults to GITHUB_TOKEN for GHCR)"
        required: false

jobs:
  build:
    name: Docker build and push
    runs-on: ${{ inputs.runs_on }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username || github.actor }}
          password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_NAME="${{ inputs.image_name }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${{ github.event.repository.name }}"
          fi
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${{ github.ref_name }}"
          fi
          FULL_IMAGE="${{ inputs.registry }}/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working_directory }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.full_image }}
          build-args: ${{ inputs.build_args }}
