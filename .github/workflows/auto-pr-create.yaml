name: Create Pull Request

on:
  workflow_call:
    inputs:
      from:
        description: "Source branch"
        required: true
        type: string
      base:
        description: "Target branch"
        required: true
        type: string
      branch:
        description: "Intermediate branch name for the PR"
        required: true
        type: string
      title:
        description: "Pull request title"
        required: true
        type: string
      labels:
        description: "Comma-separated labels to add"
        required: false
        type: string
        default: ""
      auto_merge:
        description: "Enable auto-merge on creation"
        required: false
        type: string
        default: "true"
      approve:
        description: "Auto-approve the PR"
        required: false
        type: string
        default: "true"
      bot_app_id:
        description: "GitHub App ID for authentication"
        required: true
        type: string
      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      bot_private_key:
        description: "GitHub App private key"
        required: true

jobs:
  create-pr:
    name: Create PR ${{ inputs.from }} → ${{ inputs.base }}
    runs-on: ${{ inputs.runs_on }}

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.bot_private_key }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0

      - name: Reset branch to source
        run: |
          git fetch origin ${{ inputs.from }}:${{ inputs.from }}
          git reset --hard ${{ inputs.from }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ inputs.branch }}
          title: ${{ inputs.title }}
          delete-branch: true
          labels: ${{ inputs.labels }}

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' && inputs.auto_merge == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}

      - name: Auto-approve
        if: steps.cpr.outputs.pull-request-operation == 'created' && inputs.approve == 'true'
        uses: juliangruber/approve-pull-request-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.cpr.outputs.pull-request-number }}
