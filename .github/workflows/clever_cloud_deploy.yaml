name: Clever Cloud Deploy

on:
  workflow_call:
    inputs:
      app_id:
        description: "Clever Cloud application ID"
        required: true
        type: string
      environment:
        description: "Environment label (PROD, STG, etc.)"
        required: false
        type: string
        default: ""
      service_name:
        description: "Service name for display in logs"
        required: false
        type: string
        default: ""
      expected_branch:
        description: "Branch allowed to deploy (empty to skip check)"
        required: false
        type: string
        default: ""
      same_commit_policy:
        description: "Policy when same commit is already deployed (restart, ignore, error)"
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      timeout:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 20
      auto_detect_runner:
        description: "Auto-detect self-hosted runner availability"
        required: false
        type: boolean
        default: false
    secrets:
      clever_token:
        description: "Clever Cloud API token"
        required: true
      clever_secret:
        description: "Clever Cloud API secret"
        required: true
      runner_check_token:
        description: "GitHub token to check self-hosted runner availability"
        required: false

jobs:
  check-branch:
    if: inputs.expected_branch != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch
        if: github.ref != format('refs/heads/{0}', inputs.expected_branch)
        run: |
          echo "::error::Deploys only allowed from ${{ inputs.expected_branch }} branch (current: ${{ github.ref }})"
          exit 1

  determine-runner:
    if: inputs.auto_detect_runner
    needs: check-branch
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check self-hosted runner availability
        id: check
        env:
          GH_TOKEN: ${{ secrets.runner_check_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "runner=${{ inputs.runs_on }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          RUNNERS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
            | jq -r '.runners[] | select(.status == "online" and (.labels[].name == "self-hosted")) | .name' 2>/dev/null)

          if [ -n "$RUNNERS" ]; then
            echo "Self-hosted runner available: $RUNNERS"
            echo "runner=self-hosted" >> $GITHUB_OUTPUT
          else
            echo "No self-hosted runner available, using fallback"
            echo "runner=${{ inputs.runs_on }}" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to Clever Cloud
    needs: [check-branch, determine-runner]
    if: always() && (needs.check-branch.result == 'success' || needs.check-branch.result == 'skipped') && (needs.determine-runner.result == 'success' || needs.determine-runner.result == 'skipped')
    runs-on: ${{ needs.determine-runner.outputs.runner || inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        uses: 47ng/actions-clever-cloud@v2.1.0
        with:
          appID: ${{ inputs.app_id }}
          force: true
          timeout: 1800
          sameCommitPolicy: ${{ inputs.same_commit_policy }}
        env:
          CLEVER_TOKEN: ${{ secrets.clever_token }}
          CLEVER_SECRET: ${{ secrets.clever_secret }}

      - name: Deployment summary
        if: inputs.service_name != ''
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ inputs.service_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App ID:** ${{ inputs.app_id }}" >> $GITHUB_STEP_SUMMARY
