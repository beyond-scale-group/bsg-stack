name: Cleanup Artifacts

on:
  workflow_call:
    inputs:
      patterns:
        description: "Comma-separated artifact name prefixes to match"
        required: false
        type: string
        default: ""
      max_age_hours:
        description: "Delete artifacts older than this (hours)"
        required: false
        type: number
        default: 24
      runs_on:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-latest"

jobs:
  cleanup:
    name: Cleanup old artifacts
    runs-on: ${{ inputs.runs_on }}
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeHours = ${{ inputs.max_age_hours }};
            const patternsInput = '${{ inputs.patterns }}';
            const patterns = patternsInput ? patternsInput.split(',').map(p => p.trim()) : [];
            const cutoff = Date.now() - maxAgeHours * 60 * 60 * 1000;

            let deleted = 0;
            for await (const res of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            )) {
              for (const artifact of res.data) {
                const isTarget = patterns.length === 0 || patterns.some(p => artifact.name.startsWith(p));
                const isOld = new Date(artifact.created_at).getTime() < cutoff;

                if (isTarget && isOld) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  console.log(`Deleted: ${artifact.name} (${artifact.size_in_bytes} bytes)`);
                  deleted++;
                }
              }
            }
            console.log(`Total deleted: ${deleted}`);
