# Linux developer onboarding — Ubuntu / Debian baseline.
# Assumes apt as the primary package manager.
# Edit liberally — this is a starting point, not a corporate standard.
name: linux-developer
description: Linux developer onboarding — git, runtimes, IDE, terminal, Docker.

# --- Linux (apt) ---
apt:
  - build-essential
  - git
  - curl
  - wget
  - jq
  - ripgrep
  - fzf
  - tmux                   # worktree-per-pane workflow (Superconductor alternative)
  - python3
  - python3-pip
  - python3-venv
  - openjdk-21-jdk
  - docker.io
  - docker-compose
  - gnupg
  - ca-certificates
  - apt-transport-https
  - unzip
  - zip
  - xdotool                # X11 keystroke injection for nerd-dictation

# --- Linux (snap — GUI apps + sandboxed CLIs) ---
snap:
  - code
  - slack
  - zoom-client
  - 1password
  - chromium

# --- Linux (flatpak — alternative for GUI apps) ---
flatpak:
  - com.google.Chrome
  - us.zoom.Zoom
  - com.slack.Slack

# --- Cross-platform language packages ---
npm_global:
  - "@anthropic-ai/claude-code"
  - typescript
  - prettier

pip_global:
  - black
  - ruff
  - virtualenv
  - vosk                   # offline speech engine for nerd-dictation (Wispr Flow alternative)

# --- post_install: idempotent setup commands ---
post_install:
  - 'git config --global init.defaultBranch main'
  - 'git config --global pull.rebase true'
  - 'git config --global core.editor "code --wait"'
  - 'sudo usermod -aG docker $USER'

# --- Wispr Flow alternative: nerd-dictation (system-wide voice-to-text) ---
# Wispr Flow is macOS/Windows only. nerd-dictation is offline, open source,
# and uses the VOSK engine installed via pip above.
# Clone and symlink — no package manager needed:
#   git clone https://github.com/ideasman42/nerd-dictation.git ~/nerd-dictation
#   ln -s ~/nerd-dictation/nerd-dictation ~/.local/bin/nerd-dictation
#   nerd-dictation begin  # start dictating (uses xdotool to type)
# On Wayland, replace xdotool with wtype: sudo apt install wtype

# --- Superconductor alternative: git worktree + tmux ---
# Superconductor (git worktree + Claude Code session manager) is macOS only.
# On Linux, use git worktrees + tmux panes for the same parallel workflow:
#   git worktree add ../feature-branch feature-branch
#   tmux new-session -s feature-branch -c ../feature-branch
# The BSG sync-worktree skill automates worktree lifecycle management.

# --- Node.js via nvm (apt ships an old version) ---
# Uncomment and run manually — nvm is installed via a curl script:
#   curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
#   nvm install --lts

# --- GitHub CLI (not in default apt repos) ---
# Uncomment for manual install — requires adding the GitHub apt repo:
#   curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
#     | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
#   echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
#     https://cli.github.com/packages stable main" \
#     | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
#   sudo apt update && sudo apt install gh

# --- Accounts ---
accounts:
  - { name: "GitHub", url: "https://github.com/join", notes: "Ask your manager for the org invitation. Enable MFA + add SSH key." }
  - { name: "Work email (Google Workspace)", url: "https://accounts.google.com", notes: "Enable MFA — required before any other access." }
  - { name: "Slack workspace", url: "https://YOUR-WORKSPACE.slack.com", notes: "Use your work email." }
  - { name: "Password manager vault", url: "https://1password.com/signin", notes: "Ask IT for the team invite link." }
  - { name: "VPN (if any)", url: "https://your-vpn-portal.example", notes: "IT will hand you the config file." }
  - { name: "Cloud console (AWS / GCP / Azure)", url: "https://console.cloud.example", notes: "SSO via your work email, no separate password." }

# --- Security baseline ---
security:
  - disk_encryption          # LUKS full-disk encryption
  - password_manager
  - mfa_on_email
  - mfa_on_github
  - mfa_on_cloud_console
  - ssh_key_with_passphrase
  - signed_commits           # gpg or ssh signing
  - screen_lock_5min
  - automatic_updates        # unattended-upgrades
