# BSG Autopilot — repo-level opt-in for autonomous agent development.
#
# bsg-stack is the demonstrator repo: all agents are active here to
# showcase the full autonomy pipeline end-to-end.
#
# output:commit agents (tech-lead, seo, qa) auto-implement fixes.
# output:pr agents with delegates-to (po-manager) file issues for
# output:commit agents — the PO routes work, others implement.
# Remaining output:pr agents (security, marketing, storytelling,
# pr-comms) run audits and peer review only.
# Agents never self-merge — every PR carries needs-human-review.
#
# See CLAUDE.md → "Autopilot mode" and README.md for the full spec.

enabled: true

# Default human assignee when an agent escalates an issue via
# --reason spec-clarification or --reason tech-decision (file-issue.sh)
# or when detect-stuck-issues.sh fires a tier-2 escalation. The named
# user gets the issue assigned + an @-mention in the body. See #416.
default_human_reviewer: g-dumas

agents:
  - tech
  - seo
  - qa
  - po

budget:
  max_prs_per_tick: 3
  max_prs_per_day: 200
  max_loc_per_issue: 1000
  max_files_per_issue: 8
  max_issues_per_tick: 10

# Fully autonomous mode — agents squash-merge their own implementation PRs
# instead of stopping at needs-human-review. Only safe when:
#   - Branch protection on main requires no reviews
#   - The 30 LOC / 3 file pilot budget is accepted as a sufficient gate
#   - Peer review is treated as advisory, not blocking
# bsg-stack is the demonstrator and opts in here. See CLAUDE.md →
# "Autopilot mode → auto_merge".
auto_merge: true

# bsg-stack-specific override: this is the meta-repo where agents and
# skills are authored. The default "cannot rewrite peers" clause is a
# safeguard for downstream consumer repos — here it actively blocks
# the work. We override it explicitly. See #287/#288 — agent frontmatter
# updates that an agent must perform on another agent.
override_never_auto_implements:
  tech:
    - "changes to claude-skills/agents/*.md (cannot rewrite peers)"
  qa:
    - "changes to claude-skills/agents/*.md (cannot rewrite peers)"
  seo:
    - "changes to claude-skills/agents/*.md (cannot rewrite peers)"

peer_review:
  tech:
    reviews: [qa, seo]
    criteria: [code-quality, architecture-fit, naming]
  qa:
    reviews: [tech, seo]
    criteria: [test-coverage, regression-risk]
  seo:
    reviews: [tech, qa]
    criteria: [seo-regression, meta-tag-removal, structured-data]
  security:
    reviews: [tech, qa, seo]
    criteria: [secret-patterns, injection-risk, dependency-safety]
  po:
    reviews: [tech, qa, seo]
    criteria: [plan-alignment, scope-creep, epic-binding]
